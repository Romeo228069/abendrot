const ab=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function oeffnen(pw,still){
  try{
    const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:ab(D.s),iterations:D.r,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt']);
    const klar=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:ab(D.i)},key,ab(D.c)));
    try{localStorage.setItem('fa-pw',pw)}catch(e){}
    document.open();document.write(klar);document.close();
  }catch(e){if(!still)document.getElementById('fe').textContent='Das Passwort stimmt nicht.'}
}
document.getElementById('f').onsubmit=e=>{e.preventDefault();oeffnen(document.getElementById('pw').value)};
let g=null;try{g=localStorage.getItem('fa-pw')}catch(e){}
if(g){document.documentElement.classList.add('pruefe');oeffnen(g,true).then(()=>document.documentElement.classList.remove('pruefe'))}
